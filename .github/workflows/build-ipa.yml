name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          sw_vers

      - name: 安装 xcodegen
        run: brew install xcodegen

      # 单元测试真跑在 iOS 模拟器里（runner 自带 Xcode + 模拟器运行时）。
      # 失败就 exit 非 0：后面出包/发 Release 都带 if: success()，
      # 于是「测试不过就不发版」，不再把 bug 丢给用户去发现。
      - name: 单元测试（iOS 模拟器）
        run: |
          set +e
          cd ShortDramaBox
          xcodegen generate > /tmp/test.log 2>&1
          # xcodegen 2.46 写的是 objectVersion=77（Xcode 16 格式），
          # 而 runner 上是 Xcode 15.4，读不了 —— 会和 make-ipa.sh 一样降到 56。
          # 上一轮就是漏了这一步，报 "future Xcode project file format (77)"。
          PBX="ShortDramaBox.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ] && grep -q "objectVersion = 77" "$PBX"; then
            sed -i.bak 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
            sed -i.bak '/preferredProjectObjectVersion = 77;/d' "$PBX"
            rm -f "$PBX.bak"
            echo "已把工程格式 77 -> 56"
          fi
          # 用 UDID 选设备最稳：各 runner 上机型名字不完全一样
          UDID=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | grep -oE '\([0-9A-F]{8}-[0-9A-F-]{27}\)' | head -1 | tr -d '()')
          echo "模拟器 UDID=[$UDID]"
          xcrun simctl list devices available | head -40 >> /tmp/test.log 2>&1
          if [ -z "$UDID" ]; then
            echo "找不到可用的 iPhone 模拟器" >> /tmp/test.log
            code=99
          else
            xcodebuild test \
              -project ShortDramaBox.xcodeproj \
              -scheme ShortDramaBox \
              -destination "id=$UDID" \
              -derivedDataPath /tmp/dd-test \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO >> /tmp/test.log 2>&1
            code=$?
          fi
          echo "===== 测试 exit=$code ====="
          grep -E "Test Suite .* (passed|failed)|Test Case .* (passed|failed)|Executed [0-9]+ test|error:|XCTAssert" /tmp/test.log | tail -40

          # Actions 的日志抓不下来（API 403），报告推到分支上留档
          {
            echo "=== 单元测试报告  run ${GITHUB_RUN_NUMBER}  exit=$code ==="
            echo "commit: ${GITHUB_SHA}   模拟器: ${UDID:-无}"
            echo "--- 结果 ---"
            grep -E "Test Suite .* (passed|failed)|Test Case .* (passed|failed)|Executed [0-9]+ test|error:|XCTAssert|Testing failed" /tmp/test.log | tail -300
            if [ $code -ne 0 ]; then
              echo "--- 最后 250 行 ---"
              tail -250 /tmp/test.log
            fi
          } > test-report.log
          wc -l test-report.log
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git checkout -B ci-test-log
          git add -f test-report.log
          git commit -q -m "ci: 测试报告 run ${GITHUB_RUN_NUMBER} [skip ci]" || true
          git push -f origin ci-test-log || echo "报告推送失败"
          exit $code

      - name: 打包未签名 IPA
        run: |
          set +e
          BUILD_NUMBER="${{ github.run_number }}" ./ShortDramaBox/make-ipa.sh ShortDramaBox-unsigned.ipa > /tmp/build.log 2>&1
          code=$?
          echo "exit=$code"
          if [ $code -ne 0 ]; then
            {
              echo "=== 构建失败 exit=$code ==="
              echo "--- 前 120 行 ---"
              head -120 /tmp/build.log
              echo "--- 最后 400 行 ---"
              tail -400 /tmp/build.log
              echo "--- error/fatal 行 ---"
              grep -nE "error:|fatal error|The following build commands failed|undefined symbol|cannot find|No such file|Command .* failed" /tmp/build.log | head -120
            } > build-error.log
            git config user.email "ci@users.noreply.github.com"
            git config user.name "ci"
            # 单独推一个分支：主分支上有并发的清单提交，直接 push 会被拒
            git checkout -B ci-log
            git add -f build-error.log
            git commit -q -m "ci: build error log run ${GITHUB_RUN_NUMBER} [skip ci]" || true
            git push -f origin ci-log || echo "日志推送失败"
          fi
          exit $code

      - name: 生成清单
        if: success()
        run: |
          ls -la ShortDramaBox-unsigned.ipa
          {
            echo "构建 #${GITHUB_RUN_NUMBER}  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${GITHUB_SHA}"
            echo "IPA 字节数: $(stat -f%z ShortDramaBox-unsigned.ipa)"
            echo "--- IPA 内容 ---"
            unzip -l ShortDramaBox-unsigned.ipa
            rm -rf /tmp/ck && mkdir -p /tmp/ck
            unzip -q ShortDramaBox-unsigned.ipa -d /tmp/ck
            APP=$(find /tmp/ck/Payload -maxdepth 1 -name '*.app' | head -1)
            echo "app: $APP"
            echo "--- Info.plist ---"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" 2>/dev/null || true
            echo "--- 可执行文件 ---"
            ls -la "$APP/ShortDramaBox" 2>/dev/null || true
            file "$APP/ShortDramaBox" 2>/dev/null || true
            lipo -info "$APP/ShortDramaBox" 2>/dev/null || true
            echo "--- SHA256 ---"
            shasum -a 256 ShortDramaBox-unsigned.ipa
          } > ipa-manifest.txt
          cat ipa-manifest.txt
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git add -f ipa-manifest.txt
          git commit -q -m "ci: IPA 清单 [skip ci]" || true
          git pull --rebase -q origin main || true
          git push || true

      - name: 上传 Actions 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShortDramaBox-unsigned-ipa
          path: ShortDramaBox-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Release 资源在公开仓库里可免登录直接下载，方便侧载
      - name: 发布到 Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTES="未签名 IPA，用 Sideloadly + 免费 Apple ID 安装。
          
          安装：下载下面的 ShortDramaBox-unsigned.ipa，拖进 Sideloadly，填入 Apple ID，Start。
          装完在 iPhone 的「设置 → 通用 → VPN 与设备管理」里信任证书。
          免费账号签名 7 天过期，重跑一次 Sideloadly 续期即可，数据不丢。"
          gh release create "$TAG" ShortDramaBox-unsigned.ipa \
            --title "短剧盒子 iOS 测试版 build ${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES" \
            --latest || echo "发布失败（可能已存在）"
          gh release list | head -3
